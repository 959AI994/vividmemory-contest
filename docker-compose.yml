services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vividmemory
      POSTGRES_PASSWORD: vividmemory
      POSTGRES_DB: vividmemory
    volumes:
      - vividmemory_pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vividmemory -d vividmemory"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  vividmemory:
    build:
      context: ./vividmemory-api-slim
      dockerfile: Dockerfile
    image: vividmemory-contest-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VIVIDMEMORY_API_HOST: "0.0.0.0"
      VIVIDMEMORY_API_PORT: "8888"
      VIVIDMEMORY_API_DATABASE_URL: postgresql://vividmemory:vividmemory@db:5432/vividmemory
      VIVIDMEMORY_API_LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      VIVIDMEMORY_API_LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      VIVIDMEMORY_API_LLM_API_KEY: ${LLM_API_KEY}
      VIVIDMEMORY_API_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      VIVIDMEMORY_API_EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-openai}
      VIVIDMEMORY_API_EMBEDDINGS_OPENAI_API_KEY: ${EMBEDDINGS_API_KEY:-}
      VIVIDMEMORY_API_EMBEDDINGS_OPENAI_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-large}
      VIVIDMEMORY_API_EMBEDDINGS_OPENAI_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      VIVIDMEMORY_API_RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
      VIVIDMEMORY_API_RETAIN_EXTRACTION_MODE: ${RETAIN_EXTRACTION_MODE:-custom}
      # Empty = docker-entrypoint loads prompts/contest_transitions.txt
      VIVIDMEMORY_API_RETAIN_CUSTOM_INSTRUCTIONS: ${RETAIN_CUSTOM_INSTRUCTIONS:-}
      VIVIDMEMORY_API_RERANKER_LOCAL_FORCE_CPU: ${RERANKER_LOCAL_FORCE_CPU:-true}
      VIVIDMEMORY_API_RERANKER_LOCAL_MODEL: ${RERANKER_LOCAL_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      # Contest API does not need MCP; disable to simplify startup.
      VIVIDMEMORY_API_MCP_ENABLED: "false"
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8888/health"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 300s

  adapter:
    build:
      context: ./contest-adapter
      dockerfile: Dockerfile
    image: vividmemory-contest-adapter:local
    restart: unless-stopped
    depends_on:
      vividmemory:
        condition: service_healthy
    environment:
      VIVIDMEMORY_BASE_URL: http://vividmemory:8888
      # Per-message + custom extraction on long LoCoMo sessions needs a large budget.
      ADAPTER_HTTP_TIMEOUT_SECONDS: ${ADAPTER_HTTP_TIMEOUT_SECONDS:-3600}
      ADAPTER_INCLUDE_OPTIONS_IN_QUERY: ${ADAPTER_INCLUDE_OPTIONS_IN_QUERY:-true}
      ADAPTER_RECALL_BUDGET: ${ADAPTER_RECALL_BUDGET:-high}
      ADAPTER_RECALL_MAX_TOKENS: ${ADAPTER_RECALL_MAX_TOKENS:-8192}
      ADAPTER_PER_MESSAGE_RETAIN: ${ADAPTER_PER_MESSAGE_RETAIN:-true}
      ADAPTER_RETAIN_CONCURRENCY: ${ADAPTER_RETAIN_CONCURRENCY:-8}
      ADAPTER_RECALL_INCLUDE_OBSERVATIONS: ${ADAPTER_RECALL_INCLUDE_OBSERVATIONS:-true}
      # Measured regression on LoCoMo — keep off even in the max-quality profile.
      ADAPTER_EPISODE_PREPEND: ${ADAPTER_EPISODE_PREPEND:-false}
      ADAPTER_EPISODE_PREPEND_COUNT: ${ADAPTER_EPISODE_PREPEND_COUNT:-2}
      ADAPTER_OPTIONS_IN_QUERY_MODE: ${ADAPTER_OPTIONS_IN_QUERY_MODE:-rewrite}
      ADAPTER_NEAR_DEDUP_THRESHOLD: ${ADAPTER_NEAR_DEDUP_THRESHOLD:-0.85}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  vividmemory_pgdata:
